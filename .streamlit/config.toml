[server]
address = "0.0.0.0"
port = 8501
headless = true
baseUrlPath = "streamlit"

[theme]
base = "light"
font = "sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

# Core theme values mirror ui/tokens.json. CSS handles component-level details.
[theme.light]
primaryColor = "#131517"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f7f7"
textColor = "#131517"
borderColor = "#dedfe1"

[theme.dark]
primaryColor = "#f5f5f5"
backgroundColor = "#17191b"
secondaryBackgroundColor = "#222427"
textColor = "#f5f5f5"
borderColor = "#3b3e43"
